<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Login</title>
</head>

<body>

    <h1>Bem vindo de Volta</h1>
    <span>Faça login para continuar transformando </span>
    <span> vidas com a gente </span>

    <main>
        <section>
            <h2>Escolha seu perfil :</h2>
            <button type="button">
                <span>Doador</span>
                <div></div>
                <span>Quero doar alimentos e </span>
                <span>acompanhar o impacto </span>
                <span>das minhas doações</span>
            </button>

            <button type="button">
                <span>Voluntário</span>
                <div></div>
                <span>Quero oferecer meu tempo </span>
                <span>e habilidades para ajudar </span>
                <span>em ações solidárias</span>
            </button>

            <button type="button">
                <span>Ong</span>
                <div></div>
                <span>Sou uma organização e </span>
                <span>quero gerenciar ações</span>
                <span>e receber doações</span>
            </button>
        </section>
        <br>

        <hr>

        <section>
            <form>
                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="Digite seu e-mail">

                <label for="senha">Senha:</label>
                <input type="password" id="senha" placeholder="Digite sua senha">

                <a href="">Esqueci minha senha</a>
                <br>

                <button type="submit">Entrar</button>
                <p>Ainda não tem uma conta?<a href="">Cadastre-se</a></p>
            </form>
        </section>
    </main>
</body>

</html>
