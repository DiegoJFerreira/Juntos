<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Login</title>
</head>

<body>
    <header>
        <img src="src/logo.png" alt="Juntos">
        <h1>Juntos</h1>
    </header>
    <main>
        <section>
            <h2>Bem vindo de Volta</h2>
            <p>Faça login para continuar transformando vidas com a gente.</p>
        </section>

        <section>
            <h3>Escolha seu perfil</h3>
            <button type="button">
                <img src="src/icone doador.png" alt="Doador">
                <h4>Doador</h4>
                <p>Quero doar alimentos e acompanhar o impacto das minhas doações</p>
            </button>
            <button type="button">
                <img src="src/icone voluntario.png" alt="Voluntário">
                <h4>Voluntário</h4>
                <p>Quero oferecer meu tempo e habilidades para ajudar em ações solidárias.</p>
            </button>
            <button type="button">
                <img src="src/icone ong.png" alt="Ong">
                <h4>Ong</h4>
                <p>Sou uma organização e quero gerenciar ações e receber doações</p>
            </button>
        </section>

        <article>
            <p>ou</p>
        </article>

        <section>
            <form>
                <div>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail">
                </div>
                <div>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" placeholder="Digite sua senha">
                </div>
                <div>
                    <a href="">Esqueci minha senha</a>
                    <div>
                        <button type="submit">Entrar</button>
                    </div>
                    <p>Ainda não tem uma conta? <a href="">Cadastre-se</a></p>
                </div>
            </form>
        </section>
    </main>
</body>

</html>
