<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Login</title>
</head>

<body id="login">
    <header>
        <div></div>
        <div class="logo">
            <img src="src/logoPreta.png" alt="Juntos">
            <h1>Juntos</h1>
        </div>
        <div></div>
    </header>
    <main>
        <section>
            <h2>Bem vindo de Volta</h2>
            <p>Faça login para continuar transformando vidas com a gente.</p>
        </section>

        <section>
            <h3>Escolha seu perfil</h3>
            <ul class="listaScroll">
                <button class="botao" >
                    <li class="lista2Lados">
                        <div>
                            <i class="fas fa-hand-holding-heart"></i>
                        </div>
                        <div>
                            <h4>Doador</h4>
                            <p>Quero doar alimentos e acompanhar o impacto das minhas doações</p>
                        </div>
                    </li>
                </button>
                <button>
                    <li class="lista2Lados">
                        <div>
                            <i class="fas fa-user-friends"></i>
                        </div>
                        <div>
                            <h4>Voluntário</h4>
                            <p>Quero oferecer meu tempo e habilidades para ajudar em ações solidárias.</p>
                        </div>
                    </li>
                </button>
                <button class="botao">
                    <li class="lista2Lados">
                        <div>
                            <i class="fas fa-building"></i>
                        </div>
                        <div>
                            <h4>Ong</h4>
                            <p>Sou uma organização e quero gerenciar ações e receber doações</p>
                        </div>
                    </li>
                </button>
                </li>
            </ul>
        </section>

        <article>
            <p class="linha"></p>
        </article>

        <section>
            <form>
                <div>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail">
                </div>
                <div>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" placeholder="Digite sua senha">
                </div>
                <div>
                    <a class="verTodos" href="">Esqueci minha senha</a>
                    <div>
                        <a class="verTodos" href="minhaArea.html">Entrar</a>
                    </div>
                    <p>Ainda não tem uma conta? <a class="verTodos" href="">Cadastre-se</a></p>
                </div>
            </form>
        </section>
    </main>
</body>

</html>
