<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Cadastro - Juntos</title>
</head>

<body id="login" class="claro">
    <header>
        <div></div>
        <a class="logo colorPreto" href="index.html">
            <img src="src/logoPreta.png" alt="Juntos">
            <h1>Juntos</h1>
        </a>
        <div class="headerAcoes">
            <button type="button" id="tema" aria-label="Mudar tema"><i class="fa fa-sun"></i></button>
        </div>
    </header>

    <main>
        <section>
            <h2>Crie sua conta</h2>
            <p>Cadastre-se para começar a transformar vidas com a gente.</p>
        </section>

        <section>
            <h3>Escolha seu perfil</h3>
            <div class="listaScroll">
                <button type="button" class="botao" data-perfil="doador" data-nome="Nome completo:">
                    <div class="lista2Lados">
                        <div class="colorVerdeP">
                            <i class="fas fa-hand-holding-heart"></i>
                        </div>
                        <div>
                            <h4 class="colorVerdeP">Doador</h4>
                            <p>Quero doar alimentos e acompanhar o impacto das minhas doações</p>
                        </div>
                    </div>
                </button>
                <button type="button" class="botao" data-perfil="voluntario" data-nome="Nome completo:">
                    <div class="lista2Lados">
                        <div class="colorLaranja">
                            <i class="fas fa-user-friends"></i>
                        </div>
                        <div>
                            <h4 class="colorLaranja">Voluntário</h4>
                            <p>Quero oferecer meu tempo e habilidades para ajudar em ações solidárias.</p>
                        </div>
                    </div>
                </button>
                <button type="button" class="botao" data-perfil="ong" data-nome="Nome da organização:">
                    <div class="lista2Lados">
                        <div class="colorAzul">
                            <i class="fas fa-building"></i>
                        </div>
                        <div>
                            <h4 class="colorAzul">ONG</h4>
                            <p>Sou uma organização e quero gerenciar ações e receber doações</p>
                        </div>
                    </div>
                </button>
            </div>
        </section>

        <article>
            <p class="linha"></p>
        </article>

        <section>
            <form id="formCadastro" novalidate>
                <input type="hidden" id="perfil" name="perfil" value="">
                <div class="linhaCampos">
                    <div class="campo">
                        <label for="nome" id="labelNome">Nome completo:</label>
                        <input type="text" id="nome" placeholder="Digite seu nome" required>
                    </div>
                    <div class="campo">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" placeholder="Digite seu e-mail" required>
                    </div>
                </div>
                <div class="linhaCampos">
                    <div class="campo">
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" placeholder="Crie uma senha" required>
                    </div>
                    <div class="campo">
                        <label for="confirmarSenha">Confirmar senha:</label>
                        <input type="password" id="confirmarSenha" placeholder="Digite a senha novamente" required>
                    </div>
                </div>
                <p id="erroCadastro" class="mensagemErro oculto"></p>
                <div class="acaoCentralizada">
                    <button type="submit" class="botaoLogin">Criar conta</button>
                    <p>Já tem uma conta? <a class="verTodos" href="Login.html">Faça login</a></p>
                </div>
            </form>
        </section>
    </main>

    <script src="script.js" defer></script>
    <script src="js/auth.js" defer></script>
</body>

</html>
