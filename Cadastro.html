<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Cadastro</title>
</head>

<body id="login">
    <header>
        <div></div>
        <div class="logo">
            <img src="src/logoPreta.png" alt="Juntos">
            <h1>Juntos</h1>
        </div>
        <div></div>
    </header>
    <main>
        <section>
            <h2>Crie sua conta</h2>
            <p>Cadastre-se para começar a transformar vidas com a gente.</p>
        </section>

        <section>
            <h3>Escolha seu perfil</h3>
            <ul class="listaScroll">
                <button type="button" class="botao" data-perfil="doador" data-nome="Nome completo:">
                    <li class="lista2Lados">
                        <div class="colorVerdeP">
                            <i class="fas fa-hand-holding-heart"></i>
                        </div>
                        <div>
                            <span class="tamanhoLetra">
                                <h4 class="colorVerdeP">Doador</h4>
                            </span>
                            <p>Quero doar alimentos e acompanhar o impacto das minhas doações</p>
                        </div>
                    </li>
                </button>
                <button type="button" data-perfil="voluntario" data-nome="Nome completo:">
                    <li class="lista2Lados">
                        <div class="colorLaranja">
                            <i class="fas fa-user-friends"></i>
                        </div>
                        <div>
                            <span class="tamanhoLetra">
                                <h4 class="colorLaranja">Voluntário</h4>
                            </span>
                            <p>Quero oferecer meu tempo e habilidades para ajudar em ações solidárias.</p>
                        </div>
                    </li>
                </button>
                <button type="button" class="botao" data-perfil="ong" data-nome="Nome da organização:">
                    <li class="lista2Lados">
                        <div class="colorAzul">
                            <i class="fas fa-building"></i>
                        </div>
                        <div>
                            <span class="tamanhoLetra">
                                <h4 class="colorAzul">Ong</h4>
                            </span>
                            <p>Sou uma organização e quero gerenciar ações e receber doações</p>
                        </div>
                    </li>
                </button>
            </ul>
        </section>

        <article>
            <p class="linha"></p>
        </article>

        <section>
            <form id="formCadastro">
                <input type="hidden" id="perfil" name="perfil" value="">
                <div>
                    <div class="campo">
                        <label for="nome" id="labelNome">Nome completo:</label>
                        <input type="text" id="nome" placeholder="Digite seu nome">
                    </div>
                    <div class="campo">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" placeholder="Digite seu e-mail">
                    </div>
                </div>
                <div>
                    <div class="campo">
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" placeholder="Crie uma senha">
                    </div>
                    <div class="campo">
                        <label for="confirmarSenha">Confirmar senha:</label>
                        <input type="password" id="confirmarSenha" placeholder="Digite a senha novamente">
                    </div>
                </div>
                <div>
                    <div>
                        <a class="botaoLogin" href="minhaArea.html">Criar conta</a>
                    </div>
                    <p>Já tem uma conta? <a class="verTodos" href="Login.html">Faça login</a></p>
                </div>
            </form>
        </section>
    </main>
</body>

</html>
